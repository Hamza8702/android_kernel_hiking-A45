name: Kernel Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Eski paketlerin bulunabilmesi için Ubuntu arşiv depolarını sisteme ekliyoruz
      - name: Add Legacy Repositories for libtinfo5
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y "deb http://security.ubuntu.com/ubuntu focal-security main universe"

      # 2. Temel paketleri ve artık depoda bulunabilen libtinfo5'i birlikte kuruyoruz
      - name: Install Build Dependencies and libtinfo5
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib \
          gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev \
          liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
          rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtinfo5 libtinfo6

      # 3. Resmi Google Git depolarından güncel ve kararlı AOSP Clang + GCC Araçlarını indiriyoruz
      - name: Download Google AOSP Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains
          cd $GITHUB_WORKSPACE/toolchains
          
          echo "📥 Downloading AOSP Clang..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          
          echo "📥 Downloading AOSP GCC 64-bit..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          
          echo "📥 Downloading AOSP GCC 32-bit..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      # 4. Eksik olan ld.lld ve diğer LLVM bağlarını oluşturup PATH'e ekliyoruz
      - name: Create setup.env and Fix Linkers
        run: |
          CLANG_DIR="$GITHUB_WORKSPACE/toolchains/clang/clang-r416183b/bin"
          GCC64_DIR="$GITHUB_WORKSPACE/toolchains/gcc64/bin"
          GCC32_DIR="$GITHUB_WORKSPACE/toolchains/gcc32/bin"
          
          # ld.lld eksikliğini çözmek için lld aracına güvenli bir sembolik bağ oluşturuyoruz
          if [ -f "$CLANG_DIR/lld" ] && [ ! -f "$CLANG_DIR/ld.lld" ]; then
            ln -sf "$CLANG_DIR/lld" "$CLANG_DIR/ld.lld"
          fi
          
          echo "# Environment setup for kernel compilation" > setup.env
          echo "export ARCH=arm64" >> setup.env
          echo "export SUBARCH=arm64" >> setup.env
          echo "export LLVM=1" >> setup.env
          echo "export LLVM_IAS=1" >> setup.env
          
          # Derleyicileri en yüksek öncelikli olarak sisteme tanıtıyoruz
          echo "export PATH=\"$CLANG_DIR:$GCC64_DIR:$GCC32_DIR:\$PATH\"" >> setup.env

      - name: Grant Execute Permission to Script
        run: chmod +x build.sh

      - name: Clean Previous Builds
        run: ./build.sh clean

      - name: Configure Kernel Defconfig
        run: ./build.sh config-dev

      - name: Prepare Output Directory
        run: mkdir -p out

      - name: Compile Kernel
        run: ./build.sh compile

      - name: Compile Device Tree (DTC)
        run: ./build.sh dtc

      - name: Upload Compiled Kernel and Logs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-output
          path: |
            out/
            kernel_log.log
