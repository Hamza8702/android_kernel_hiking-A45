name: Build Hiking A45

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison git-core libssl-dev \
            libelf-dev clang-17 llvm-17 lld-17 libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3-minimal zip ccache xxd

      - name: Cache Setup
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Prepare Environment
        run: |
          mkdir -p out
          ccache -M 25G
          echo "/usr/lib/llvm-17/bin" >> $GITHUB_PATH

      - name: Configure Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            RMX3511_defconfig
      - name: Compile Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 

      - name: Verify EFI Signature
        run: |
          echo "Checking for EFI Magic Number (MZ)..."
          # If EFI Stub is enabled correctly, the Image file must start with 'MZ' (4d5a).
          head -c 2 out/arch/arm64/boot/Image | xxd
          grep -E "CONFIG_KVM|CONFIG_EFI_STUB|CONFIG_RELOCATABLE" out/.config

      - name: Archive Boot Assets
        run: |
          zip -j miatoll-uefi-assets.zip \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot \
            out/.config

      - name: Upload UEFI Assets
        uses: actions/upload-artifact@v4
        with:
          name: Hiking_A45
          path: Hiking_A45_kernel.zip
