name: Build hiking A45 kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison git-core libssl-dev \
            libelf-dev clang-20 llvm-20 lld-20 libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3-minimal zip ccache xxd

      - name: Cache Setup
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Prepare Environment
        run: |
          mkdir -p out
          ccache -M 25G

      - name: Configure Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            sprd_debian_defconfig
          
          make -j$(nproc --all) O=out ARCH=arm64 olddefconfig

      - name: Compile Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \

      - name: Archive Boot Assets
        run: |
          zip -j miatoll-uefi-assets.zip \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot \
            out/.config

      - name: Upload UEFI Assets
        uses: actions/upload-artifact@v4
        with:
          name: Hiking-A45-Kernel
          path: Hiking-A45.zip
